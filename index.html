<style>
:root {
  --c-white:#ffffff; --c-page:#F3F4F6; --c-border:#E5E7EB; --c-border-light:#F3F4F6;
  --c-text:#1F2937; --c-text-2:#4B5563; --c-text-3:#9CA3AF; --c-navy:#0F172A;

  --c-red-border:#FECACA; --c-amber:#D97706; --c-amber-bg:#FFFBEB;
  --shadow-card:0 4px 6px -1px rgba(0,0,0,.10),0 2px 4px -1px rgba(0,0,0,.06);
  --shadow-hover:0 10px 15px -3px rgba(0,0,0,.10),0 4px 6px -2px rgba(0,0,0,.05);
  --radius:10px; --radius-lg:16px; --font:'Vazirmatn',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--c-page);color:var(--c-text);min-height:100vh;direction:rtl}
.layout{display:flex;min-height:100vh}
.sidebar{width:292px;min-width:292px;background:var(--c-navy);display:flex;flex-direction:column;position:fixed;top:0;right:0;height:100vh;z-index:100;transition:width .3s ease}
.sidebar.collapsed{width:72px;min-width:72px}
.sidebar-logo{padding:20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px}
.logo-icon{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon i{font-size:25px;color:#60A5FA}
.logo-text{overflow:hidden;white-space:nowrap}
.logo-title{font-size:15px;font-weight:800;color:#fff}
.logo-sub{font-size:11px;color:#9CA3AF;margin-top:2px}
.nav-list{list-style:none;overflow-y:auto;flex:1;padding:14px 10px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;color:#9CA3AF;font-size:12.8px;font-weight:600;transition:.2s;margin-bottom:5px;white-space:nowrap;overflow:hidden}
.nav-item i{font-size:20px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--c-blue);color:#fff}
.nav-count{margin-right:auto;background:rgba(255,255,255,.10);border-radius:999px;padding:1px 7px;font-size:11px;color:#D1D5DB}
.nav-item.active .nav-count{background:rgba(255,255,255,.18);color:#fff}
.sidebar.collapsed .nav-item span,.sidebar.collapsed .nav-count,.sidebar.collapsed .logo-text,.sidebar.collapsed .toggle-btn span{display:none}
.sidebar-toggle{padding:15px;border-top:1px solid rgba(255,255,255,.06)}
.toggle-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;background:rgba(255,255,255,.05);border:none;border-radius:var(--radius);color:#9CA3AF;cursor:pointer;transition:.2s;font-family:inherit;font-size:13px}
.toggle-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.main{margin-right:292px;flex:1;display:flex;flex-direction:column;min-height:100vh;transition:margin-right .3s ease}
.main.expanded{margin-right:72px}
.topbar{background:var(--c-white);padding:14px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--c-border);position:sticky;top:0;z-index:50}
.topbar-title{font-size:16px;font-weight:800;color:var(--c-text)}
.topbar-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.source-badge{background:var(--c-blue-light);color:var(--c-blue);border-color:var(--c-blue-soft)}

.opt-letter{width:30px;height:30px;border-radius:8px;border:2px solid var(--c-border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--c-text-2);flex-shrink:0}
.opt-item.sel .opt-letter{background:var(--c-blue);border-color:var(--c-blue);color:#fff}
.opt-item.correct .opt-letter{background:var(--c-green);border-color:var(--c-green);color:#fff}
.opt-item.wrong .opt-letter{background:var(--c-red);border-color:var(--c-red);color:#fff}
.opt-text{font-size:14px;flex:1;line-height:1.75}
.opt-icon{font-size:20px;opacity:0;transition:.2s;flex-shrink:0}
.opt-item.correct .opt-icon{opacity:1;color:var(--c-green)}
.opt-item.wrong .opt-icon{opacity:1;color:var(--c-red)}
.explain-panel{display:none;background:#F8FAFC;border-top:1px solid var(--c-border);padding:25px;animation:slideDown .3s ease}
.explain-panel.open{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.answer-line{margin-bottom:15px;font-weight:800;font-size:15px;color:var(--c-green);display:flex;align-items:center;gap:8px}
.explain-text{font-size:14px;line-height:1.95;color:var(--c-text-2);margin-bottom:18px;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);padding:14px 16px}
.rationale-list{display:flex;flex-direction:column;gap:10px}
.rat-item{padding:12px 15px;border-radius:var(--radius);border:1px solid var(--c-border);background:var(--c-white);font-size:13.5px;line-height:1.75}
.rat-item.ri-correct{background:var(--c-green-bg);border-color:var(--c-green-border)}
.rat-item.ri-wrong{background:var(--c-red-bg);border-color:var(--c-red-border)}
.rat-title{font-weight:800;margin-bottom:4px}
.ri-correct .rat-title{color:var(--c-green)}
.ri-wrong .rat-title{color:var(--c-red)}
.card-footer{padding:20px 25px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--c-white);border-top:1px solid var(--c-border)}
.nav-btn{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--radius);border:none;background:var(--c-navy);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
.nav-btn:hover:not(:disabled){background:var(--c-blue)}
.nav-btn:disabled{opacity:.5;cursor:not-allowed}
.nav-btn.secondary{background:var(--c-page);color:var(--c-text);border:1px solid var(--c-border)}
.nav-btn.secondary:hover:not(:disabled){background:var(--c-border)}
.q-position{font-size:12px;color:var(--c-text-3);font-weight:700}
.empty{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:40px;text-align:center;color:var(--c-text-2)}
@media (max-width:900px){.overview{grid-template-columns:repeat(2,1fr)}}
@media (max-width:768px){.sidebar{transform:translateX(100%)}.sidebar.open{transform:translateX(0)}.main{margin-right:0!important}.topbar{padding:12px 16px}.content{padding:16px}.q-body{font-size:15px;padding:20px}.options-wrap{padding:0 20px 20px}.overview{grid-template-columns:1fr}}
@media print{.sidebar,.topbar,.card-footer{display:none!important}.main{margin-right:0!important}.content{max-width:none;padding:0}.q-card{box-shadow:none;border:1px solid #999;page-break-inside:avoid}}
</style>

ت و high-pressure zone ورودی مری را ایجاد می‌کند.", "rationales": ["thyropharyngeus در دیواره حلق نقش دارد اما مسئول اصلی فشار UES نیست.", "cricopharyngeus جزء اصلی عملکردی UES است و high-pressure zone ورودی مری را ایجاد می‌کند.", "posterior cricoarytenoid عضله حنجره‌ای است و نقش اصلی در باز کردن گلوت دارد.", "عضله طولی مری در انتقال و ساختار دیواره دخیل است، نه ایجاد فشار پایه UES."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 4, "tag": "Zenker", "tagLabel": "Zenker", "category": "diverticulum", "question": "در تصویربرداری بلع، بیرون‌زدگی خلفی در محل ضعف بین فیبرهای مایل thyropharyngeus و فیبرهای افقی cricopharyngeus دیده می‌شود. نام این ناحیه چیست؟", "options": ["Laimer triangle", "Killian triangle", "collar of Helvetius", "gastroesophageal fat pad"], "answer": "ب", "correctIndex": 1, "explanation": "Killian triangle محل کلاسیک ضعف بین thyropharyngeus و cricopharyngeus و محل Zenker diverticulum است.", "rationales": ["ناحیه Laimer با V-shaped area در انتقال عضلات مطرح می‌شود، اما محل کلاسیک Zenker نیست.", "Killian triangle محل کلاسیک ضعف بین thyropharyngeus و cricopharyngeus و محل Zenker diverticulum است.", "collar of Helvetius شاخص خارجی GEJ است.", "gastroesophageal fat pad نیز شاخص خارجی GEJ است، نه ورودی مری."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 5, "tag": "Anatomy", "tagLabel": "آناتومی و لایه‌ها", "category": "anatomy", "question": "کدام ویژگی با نبود serosa در مری بیشترین ارتباط بالینی را دارد؟", "options": ["کاهش انتشار عفونت پیرامری", "سهولت ترمیم و کاهش نشت آناستوموز", "انتشار آسان‌تر عفونت و تومور به بافت پیرامری", "کاهش اهمیت adventitia در جراحی"], "answer": "ج", "correctIndex": 2, "explanation": "مری serosa ندارد و با adventitia احاطه می‌شود؛ بنابراین عفونت، نشت و گسترش موضعی تومور می‌تواند آسان‌تر رخ دهد.", "rationales": ["نبود serosa انتشار عفونت را کم نمی‌کند؛ آن را تسهیل می‌کند.", "نبود serosa ترمیم را دشوارتر و خطر نشت را مهم‌تر می‌کند.", "مری serosa ندارد و با adventitia احاطه می‌شود؛ بنابراین عفونت، نشت و گسترش موضعی تومور می‌تواند آسان‌تر رخ دهد.", "adventitia پوشش بیرونی مری است و در جراحی اهمیت دارد."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 6, "tag": "GEJ", "tagLabel": "GEJ و Z-line", "category": "anatomy", "question": "در بیمار مبتلا به Barrett، کدام شاخص آندوسکوپیک برای تعیین GEJ از Z-line قابل اعتمادتر است؟", "options": ["شروع چین‌های معده", "محل بیشترین فشار LES در مانومتری", "محل تنگی cricopharyngeal", "انتهای عضله مخطط مری"], "answer": "الف", "correctIndex": 0, "explanation": "در Barrett، Z-line می‌تواند به پروگزیمال جابه‌جا شود؛ شروع rugal folds معده شاخص آندوسکوپیک قابل اتکاتری برای GEJ است.", "rationales": ["در Barrett، Z-line می‌تواند به پروگزیمال جابه‌جا شود؛ شروع rugal folds معده شاخص آندوسکوپیک قابل اتکاتری برای GEJ است.", "مانومتری LES برای فیزیولوژی مفید است اما شاخص آندوسکوپیک GEJ نیست.", "cricopharyngeal narrowing مربوط به UES است.", "انتقال عضله مخطط به صاف شاخص GEJ نیست."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 7, "tag": "Anatomy", "tagLabel": "آناتومی و لایه‌ها", "category": "anatomy", "question": "در زیرمخاط مری کدام مجموعه بیشترین اهمیت را در گسترش طولی سرطان مری دارد؟", "options": ["شبکه غدد اندوکرین و سلول‌های G", "شبکه لنفاوی و عروقی غنی همراه با Meissner plexus", "لایه کامل serosa و عقده‌های سلیاک", "عضله مخطط و عصب recurrent laryngeal"], "answer": "ب", "correctIndex": 1, "explanation": "زیرمخاط مری دارای شبکه لنفاوی و عروقی غنی، غدد مخاطی و Meissner plexus است و مسیر مهم گسترش طولی تومور است.", "rationales": ["سلول‌های G مربوط به آنتروم معده‌اند.", "زیرمخاط مری دارای شبکه لنفاوی و عروقی غنی، غدد مخاطی و Meissner plexus است و مسیر مهم گسترش طولی تومور است.", "مری serosa واقعی ندارد و عقده سلیاک داخل زیرمخاط نیست.", "عضله مخطط در muscularis propria است و recurrent laryngeal nerve خارج دیواره قرار دارد."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 8, "tag": "Anatomy", "tagLabel": "آناتومی و لایه‌ها", "category": "anatomy", "question": "در مورد muscularis propria مری، کدام گزینه صحیح است؟", "options": ["یک‌سوم فوقانی عمدتاً عضله مخطط و دو سوم تحتانی عمدتاً عضله صاف دارد.", "تمام طول مری عضله صاف دارد.", "تمام طول مری عضله مخطط دارد.", "لایه عضلانی مری فقط طولی است و لایه حلقوی ندارد."], "answer": "الف", "correctIndex": 0, "explanation": "در مری، زیر cricopharyngeus دو لایه عضلانی حلقوی و طولی وجود دارد؛ یک‌سوم فوقانی مخطط و دو سوم تحتانی صاف است.", "rationales": ["در مری، زیر cricopharyngeus دو لایه عضلانی حلقوی و طولی وجود دارد؛ یک‌سوم فوقانی مخطط و دو سوم تحتانی صاف است.", "تمام طول مری صاف نیست؛ قسمت فوقانی مخطط است.", "تمام طول مری مخطط نیست؛ بخش تحتانی صاف است.", "مری دو لایه اصلی داخلی حلقوی و خارجی طولی دارد."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 9, "tag": "GEJ", "tagLabel": "GEJ و Z-line", "category": "anatomy", "question": "در جراحی ناحیه کاردیا، جراح به محل اتصال فیبرهای حلقوی مری به فیبرهای مایل معده توجه می‌کند. این شاخص خارجی GEJ چه نام دارد؟", "options": ["Z-line", "collar of Helvetius", "Killian triangle", "phrenoesophageal membrane"], "answer": "ب", "correctIndex": 1, "explanation": "collar of Helvetius یا loop of Willis شاخص خارجی محل گذار فیبرهای حلقوی مری به فیبرهای مایل معده و معرف GEJ است.", "rationales": ["Z-line شاخص مخاطی/آندوسکوپیک است.", "collar of Helvetius یا loop of Willis شاخص خارجی محل گذار فیبرهای حلقوی مری به فیبرهای مایل معده و معرف GEJ است.", "Killian triangle مربوط به ورودی مری و Zenker است.", "phrenoesophageal membrane در مکانیسم رفلاکس و hiatus مطرح است اما شاخص اصلی GEJ در این سؤال نیست."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 10, "tag": "Anatomy", "tagLabel": "آناتومی و لایه‌ها", "category": "anatomy", "question": "کدام تنگی طبیعی مری تنگ‌ترین نقطه دستگاه گوارش و شایع‌ترین محل گیر کردن جسم خارجی است؟", "options": ["cricopharyngeal narrowing", "bronchoaortic constriction", "diaphragmatic constriction", "GEJ fat pad"], "answer": "الف", "correctIndex": 0, "explanation": "cricopharyngeal narrowing حدود ۱۴ میلی‌متر قطر دارد و تنگ‌ترین نقطه GI tract است.", "rationales": ["cricopharyngeal narrowing حدود ۱۴ میلی‌متر قطر دارد و تنگ‌ترین نقطه GI tract است.", "bronchoaortic constriction تنگی میانی در سطح کارینا/آئورت است.", "diaphragmatic constriction در hiatus قرار دارد و تنگ‌ترین نقطه نیست.", "fat pad تنگی طبیعی محسوب نمی‌شود."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 11, "tag": "Anatomy", "tagLabel": "آناتومی و لایه‌ها", "category": "anatomy", "question": "در بلع باریم، تنگی در سطح تماس مری با قوس آئورت و برونش اصلی چپ دیده می‌شود. این تنگی معمولاً با کدام سطح و قطر تقریبی تطابق دارد؟", "options": ["C6 و ۱۴ میلی‌متر", "T4 و ۱۵ تا ۱۷ میلی‌متر", "T11 و ۱۶ تا ۱۹ میلی‌متر", "T1 و ۲۵ میلی‌متر"], "answer": "ب", "correctIndex": 1, "explanation": "bronchoaortic constriction در سطح حدود T4 و زیر کارینا است و قطر آن حدود ۱۵ تا ۱۷ میلی‌متر است.", "rationales": ["C6 و ۱۴ میلی‌متر مربوط به cricopharyngeal narrowing است.", "bronchoaortic constriction در سطح حدود T4 و زیر کارینا است و قطر آن حدود ۱۵ تا ۱۷ میلی‌متر است.", "T11 و ۱۶ تا ۱۹ میلی‌متر با diaphragmatic constriction مرتبط است.", "T1 شاخص اصلی این تنگی نیست."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 12, "tag": "Vascular", "tagLabel": "عروق و وریدها", "category": "anatomy", "question": "در مرور خون‌رسانی مری، کدام تطابق ناحیه با منبع شریانی اصلی درست‌تر است؟", "options": ["مری گردنی: inferior thyroid arteries؛ مری توراسیک: شاخه‌های مری آئورت و bronchial arteries؛ مری شکمی: left gastric و inferior phrenic arteries", "مری گردنی: left gastric؛ مری توراسیک: inferior thyroid؛ مری شکمی: intercostal arteries", "مری گردنی: short gastric؛ مری توراسیک: superior mesenteric؛ مری شکمی: bronchial arteries", "تمام طول مری فقط از left gastric artery خون می‌گیرد"], "answer": "الف", "correctIndex": 0, "explanation": "خون‌رسانی مری سگمنتال است: بخش گردنی عمدتاً از inferior thyroid، بخش توراسیک از شاخه‌های مری آئورت و bronchial arteries، و بخش شکمی از left gastric و inferior phrenic arteries تغذیه می‌شود.", "rationales": ["خون‌رسانی مری سگمنتال است: بخش گردنی عمدتاً از inferior thyroid، بخش توراسیک از شاخه‌های مری آئورت و bronchial arteries، و بخش شکمی از left gastric و inferior phrenic arteries تغذیه می‌شود.", "تطابق نواحی و شریان‌ها برعکس و نادرست است.", "short gastric و SMA منبع اصلی مری نیستند و bronchial arteries مربوط به بخش توراسیک‌اند.", "left gastric فقط در مری شکمی نقش مهم دارد، نه در تمام طول مری."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 13, "tag": "Vascular", "tagLabel": "عروق و وریدها", "category": "anatomy", "question": "در بیمار سیروتیک با واریس دیستال مری، ارتباط پورتوسیستمیک اصلی از کدام مسیر ایجاد می‌شود؟", "options": ["left gastric vein به وریدهای مری و سپس azygos system", "inferior mesenteric vein به internal iliac vein", "portal vein به inferior thyroid vein", "short gastric vein به superior vena cava بدون واسطه"], "answer": "الف", "correctIndex": 0, "explanation": "واریس مری حاصل گشاد شدن مسیر left gastric/coronary vein به شبکه وریدی زیرمخاطی مری و سپس سیستم azygos است.", "rationales": ["واریس مری حاصل گشاد شدن مسیر left gastric/coronary vein به شبکه وریدی زیرمخاطی مری و سپس سیستم azygos است.", "این مسیر مربوط به آناستوموزهای رکتال است.", "inferior thyroid vein برای مری گردنی است و مسیر کلاسیک واریس دیستال نیست.", "short gastric veins در دیستال نقش دارند اما مسیر کلاسیک امتحانی left gastric به azygos است."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 14, "tag": "Lymphatics", "tagLabel": "لنفاتیک", "category": "anatomy", "question": "علت دشواری کنترل انکولوژیک سرطان مری و امکان درگیری گره‌های دورتر از تومور چیست؟", "options": ["نبود جریان لنف در مری", "شبکه لنفاوی طولی گسترده، با جریان رو به بالا در دو سوم فوقانی و رو به پایین در یک سوم دیستال", "وجود یک غده لنفی منفرد کنار GEJ", "فقط انتشار هماتوژن بدون انتشار لنفاوی"], "answer": "ب", "correctIndex": 1, "explanation": "لنفاتیک مری گسترده و طولی است؛ در دو سوم فوقانی تمایل به جریان رو به بالا و در یک سوم دیستال رو به پایین دارد.", "rationales": ["مری شبکه لنفاوی بسیار گسترده دارد.", "لنفاتیک مری گسترده و طولی است؛ در دو سوم فوقانی تمایل به جریان رو به بالا و در یک سوم دیستال رو به پایین دارد.", "د ": "برای عبور بولوس، UES شل می‌شود؛ سپس حدود نیم ثانیه پس از شروع بلع بسته شده و فشار آن بالا می‌رود.", "rationales": ["انقباض پایدار UES مانع عبور بولوس می‌شود.", "برای عبور بولوس، UES شل می‌شود؛ سپس حدود نیم ثانیه پس از شروع بلع بسته شده و فشار آن بالا می‌رود.", "LES در انتهای مسیر بولوس اهمیت دارد نه شروع ورود به مری.", "گلوت باید محافظت و بسته شود تا آسپیراسیون رخ ندهد."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 18, "tag": "Physiology", "tagLabel": "فیزیولوژی و بلع", "category": "physiology", "question": "کدام گزینه درباره LES در سابیستون صحیح است؟", "options": ["یک اسفنکتر آناتومیک واضح مانند پیلور است.", "high-pressure zone عملکردی با طول حدود ۲ تا ۵ سانتی‌متر و فشار پایه حدود ۶ تا ۲۶ mmHg است.", "در حالت طبیعی فشار صفر دارد.", "فقط با عضله مخطط ساخته می‌شود."], "answer": "ب", "correctIndex": 1, "explanation": "LES اسفنکتر آناتومیک واضح نیست؛ یک ناحیه پرفشار عملکردی با فشار پایه ۶ تا ۲۶ mmHg و طول چند سانتی‌متر است.", "rationales": ["LES مانند UES/پیلور مرز عضلانی آناتومیک واضح ندارد.", "LES اسفنکتر آناتومیک واضح نیست؛ یک ناحیه پرفشار عملکردی با فشار پایه ۶ تا ۲۶ mmHg و طول چند سانتی‌متر است.", "فشار پایه آن صفر نیست و برای جلوگیری از رفلاکس لازم است.", "ناحیه دیستال مری عمدتاً عضله صاف است."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 19, "tag": "Physiology", "tagLabel": "فیزیولوژی و بلع", "category": "physiology", "question": "بیمار با بلع مکرر و باقی ماندن غذا در مری بررسی می‌شود. موج پریستالتیک ناشی از بلع مستقیم لقمه چه نام دارد؟", "options": ["primary peristalsis", "secondary peristalsis", "tertiary contraction", "segmentation"], "answer": "الف", "correctIndex": 0, "explanation": "primary peristalsis با بلع آغاز می‌شود و موج اصلی انتقال بولوس است.", "rationales": ["primary peristalsis با بلع آغاز می‌شود و موج اصلی انتقال بولوس است.", "secondary peristalsis معمولاً پاسخ به اتساع یا باقی‌ماندن بولوس در مری است.", "tertiary contractions غیرپیش‌رونده و غیرپریستالتیک‌اند.", "segmentation الگوی روده‌ای است و برای مری به این معنا به کار نم رد low-risk می‌تواند با EMR/ablation درمان شود؛ T1b زیرمخاط را درگیر می‌کند و خطر nodal به‌طور معنی‌دار بیشتر است.", "adventitia معادل T3 است.", "T1b به‌خصوص در SM2/SM3 خطر nodal قابل توجه دارد.", "HGD/Tis هنوز از basement membrane عبور نکرده است."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 81, "tag": "Esophageal cancer", "tagLabel": "سرطان مری", "category": "cancer", "question": "کدام ترکیب ریسک‌فاکتور و هیستولوژی صحیح است؟", "options": ["Smoking/alcohol/achalasia/caustic injury با SCC؛ Barrett/GERD/obesity با adenocarcinoma", "Barrett با SCC پروگزیمال به طور کلاسیک", "caustic injury فقط با adenocarcinoma دیستال", "obesity فقط با small cell carcinoma مری"], "answer": "الف", "correctIndex": 0, "explanation": "SCC با tobacco، alcohol، achalasia و caustic injury مرتبط است؛ adenocarcinoma اغلب از Barrett در زمینه GERD و obesity در دیستال/GEJ ایجاد می‌شود.", "rationales": ["SCC با tobacco، alcohol، achalasia و caustic injury مرتبط است؛ adenocarcinoma اغلب از Barrett در زمینه GERD و obesity در دیستال/GEJ ایجاد می‌شود.", "Barrett عمدتاً پیش‌زمینه adenocarcinoma است.", "caustic injury خطر SCC را بالا می‌برد.", "obesity با adenocarcinoma از طریق GERD/Barrett مرتبط‌تر است."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 82, "tag": "Esophageal cancer", "tagLabel": "سرطان مری", "category": "cancer", "question": "کدام محل برای SCC مری شایع‌تر است؟", "options": ["پروگزیمال و میانی مری", "فقط GEJ دیستال", "آنتروم معده", "کولون راست"], "answer": "الف", "correctIndex": 0, "explanation": "SCC می‌تواند هر جایی در مری باشد اما اغلب در مری پروگزیمال و میانی رخ می‌دهد.", "rationales": ["SCC می‌تواند هر جایی در مری باشد اما اغلب در مری پروگزیمال و میانی رخ می‌دهد.", "GEJ/دیستال بیشتر با adenocarcinoma مرتبط است.", "آنتروم معده محل سرطان معده است.", "کولون راست به سرطان کولون مربوط است."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 83, "tag": "Esophageal cancer", "tagLabel": "سرطان مری", "category": "cancer", "question": "مرد چاق با GERD طولانی و Barrett، دچار دیسفاژی پیشرونده شده و توده GEJ دارد. محتمل‌ترین هیستولوژی چیست؟", "options": ["adenocarcinoma", "SCC", "melanoma اولیه مری", "leiomyoma"], "answer": "الف", "correctIndex": 0, "explanation": "Adenocarcinoma در زمینه Barrett/GERD و چاقی و در دیستال مری/GEJ شایع است.", "rationales": ["Adenocarcinoma در زمینه Barrett/GERD و چاقی و در دیستال مری/GEJ شایع است.", "SCC بیشتر با smoking/alcohol و محل پروگزیمال/میانی ارتباط دارد.", "melanoma اولیه مری بسیار نادر است.", "leiomyoma خوش‌خیم و با مخاط سالم است."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 84, "tag": "Esophageal cancer", "tagLabel": "سرطان مری", "category": "cancer", "question": "کدام علامت در سرطان مری بیشترین ارزش هشداردهنده کلاسیک دارد؟", "options": ["دیسفاژی پیشرونده از جامدات به مایعات همراه کاهش وزن", "درد LLQ و یبوست مزمن", "درد RUQ بعد غذای چرب", "اسهال آبکی حاد بدون دیسفاژی"], "answer": "الف", "correctIndex": 0, "explanation": "سرطان مری معمولاً با دیسفاژی پیشرونده، ابتدا جامدات و سپس مایعات، و کاهش وزن تظاهر می‌کند.", "rationales": ["سرطان مری معمولاً با دیسفاژی پیشرونده، ابتدا جامدات و سپس مایعات، و کاهش وزن تظاهر می‌کند.", "این الگو مربوط به کولون/دیورتیکولیت یا انسداد روده است.", "این الگو بیشتر صفراوی است.", "اسهال حاد مسیر تشخیصی سرطان مری را توضیح نمی‌دهد."], "source": "Sabiston Chapter 42: Esophagus"}, {"id": 85, "tag": "Esophageal cancer", "tagLabel": "سرطان مری", "category": "cancer", "question": "اولین روش قطعی برای تشخیص سرطان مری چیست؟", "options": ["EGD با بیوپسی‌های متعدد از ضایعه مشکوک", "PET/CT بدون بیوپسی", "pH monitoring", "مانومتری فقط"], "answer": "الف", "correctIndex": 0, "explanation": "تشخیص سرطان مری تقریباً همیشه با endoscopic biopsy انجام می‌شود و از ضایعات مشکوک باید بیوپسی‌های متعدد گرفت.", "rationales": ["تشخیص سرطان مری تقریباً همیشه با endoscopic biopsy انجام می‌شود و از ضایعات مشکوک باید بیوپسی‌های متعدد گرفت.", "PET/CT برای staging متاستاز است و جای بیوپسی را نمی‌گیرد.", "pH monitoring رفلاکس را می‌سنجد.", "مانومتری سرطان را تشخیص قطعی نمی‌دهد."], "source": "Sab     const q = QUESTIONS.find(x => x.id === Number(id));
    return q && q.correctIndex === idx;
  }).length;
  document.getElementById('overview').innerHTML = `
    <div class="overview-card"><div class="overview-num">${faNum(QUESTIONS.length)}</div><div class="overview-label">کل سؤالات فصل مری</div></div>
    <div class="overview-card"><div class="overview-num">${faNum(filtered.length)}</div><div class="overview-label">سؤالات دسته فعال</div></div>
    <div class="overview-card"><div class="overview-num">${faNum(answeredCount)}</div><div class="overview-label">پاسخ ثبت‌شده در این نشست</div></div>
    <div class="overview-card"><div class="overview-num">${faNum(correctCount)}</div><div class="overview-label">پاسخ صحیح ثبت‌شده</div></div>`;
}
function showQuestion(id) {
  const q = QUESTIONS.find(x => x.id === id);
  if (!q) return;
  currentView = { qId: id, selectedIdx: null, revealed: false };
  renderQuestionUI(id);
  updateStats();
  renderOverview();
}
function pickOption(qId, optIdx) {
  if (currentView.revealed) return;
  currentView.selectedIdx = optIdx;
  currentView.revealed = true;
  state.answered[qId] = optIdx;
  renderQuestionUI(qId);
  updateStats();
  renderOverview();
}
function renderQuestionUI(id) {
  const q = QUESTIONS.find(x => x.id === id);
  const filtered = getFilteredQuestions();
  const curIdx = filtered.findIndex(x => x.id === id);
  const isRevealed = currentView.revealed;
  const selIdx = currentView.selectedIdx;
  const optHTML = q.options.map((text, i) => {
    let cls = 'opt-item';
    let iconCls = 'ti ti-circle opt-icon';
    if (isRevealed) {
      if (i === q.correctIndex) { cls += ' correct'; iconCls = 'ti ti-circle-check opt-icon'; }
      else if (i === selIdx) { cls += ' wrong'; iconCls = 'ti ti-circle-x opt-icon'; }
    } else if (i === selIdx) cls += ' sel';
    return `<div class="${cls}" onclick="pickOption(${q.id}, ${i})">
      <div class="opt-letter">${LETTERS[i]}</div>
      <div class="opt-text">${escapeHTML(text)}</div>
      <i class="${iconCls}"></i>
    </div>`;
  }).join('');
  let explainHTML = '';
  if (isRevealed) {
    const correctLet = LETTERS[q.correctIndex];
    const ratHTML = q.rationales.map((text, i) => {
      const ok = i === q.correctIndex;
      return `<div class="rat-item ${ok ? 'ri-correct' : 'ri-wrong'}">
        <div class="rat-title">${ok ? '✅' : '❌'} گزینه ${LETTERS[i]})</div>
        <div>${escapeHTML(text || (ok ? q.explanation : ''))}</div>
      </div>`;
    }).join('');
    explainHTML = `<div class="explain-panel open">
      <div class="answer-line"><i class="ti ti-circle-check"></i> پاسخ صحیح: گزینه ${correctLet}</div>
      <div class="explain-text">${escapeHTML(q.explanation)}</div>
      <div class="rationale-list">${ratHTML}</div>
    </div>`;
  }
  const hasPrev = curIdx > 0;
  const hasNext = curIdx < filtered.length - 1;
  const prevId = hasPrev ? filtered[curIdx - 1].id : null;
  const nextId = hasNext ? filtered[curIdx + 1].id : null;
  document.getElementById('qContainer').innerHTML = `<div class="q-card">
    <div class="q-header"><div class="tag">${escapeHTML(q.tagLabel)}</div><div class="q-number">سؤال ${faNum(q.id)} از ${faNum(QUESTIONS.length)} · ${escapeHTML(q.source)}</div></div>
    <div class="q-body">${faNum(q.id)}. ${escapeHTML(q.question)}</div>
    <div class="options-wrap">${optHTML}</div>
    ${explainHTML}
    <div class="card-footer">
      <button class="nav-btn secondary" onclick="if(${hasPrev}) showQuestion(${prevId})" ${!hasPrev ? 'disabled' : ''}><i class="ti ti-chevron-right"></i> قبلی</button>
      <div class="q-position">${faNum(curIdx + 1)} / ${faNum(filtered.length)} در دسته فعال</div>
      <button class="nav-btn" onclick="if(${hasNext}) showQuestion(${nextId})" ${!hasNext ? 'disabled' : ''}>بعدی <i class="ti ti-chevron-left"></i></button>
    </div>
  </div>`;
}
function setCategory(catId) {
  state.currentCategory = catId;
  const cat = CATEGORIES.find(c => c.id === catId) || CATEGORIES[0];
  document.getElementById('pageTitle').textContent = cat.label;
  renderNav();
  const filtered = getFilteredQuestions();
  if (filtered.length) showQuestion(filtered[0].id);
  else document.getElementById('qContainer').innerHTML = '<div class="empty">سؤالی در این دسته یافت نشد.</div>';
  renderOverview();
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
  document.getElementById('mainArea').classList.toggle('expanded');
}
window.onload = () => setCategory('all');
</script>
</body>
</html>
